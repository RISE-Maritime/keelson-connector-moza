[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keelson-connector-moza"
version = "0.1.0"
description = "Moza direct-drive wheelbase (R21 Ultra) as a keelson helm: wheel, pedals and buttons onto the bus, rudder follow-up as force feedback. Linux (evdev) and macOS (HID)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # EXACT pin, never a path or a range. 0.6.0rc19 is keelson's integration line
    # (tag 0.6.0-pre.19): wheel_position_pct, the realtime QoS profile and
    # scaffolding.declare_liveliness are all on it.
    "keelson==0.6.0rc19",
    "pyyaml==6.0.3",
    # Linux only: the wheel is read and driven through the kernel's evdev
    # interface (hid-universal-pidff). evdev ships as an sdist and needs the
    # kernel headers to build, so it is never installed on macOS -- the tests
    # run there against the fake device.
    "evdev==2.0.0; sys_platform == 'linux'",
    # macOS: the wheel is read and driven over USB HID (moza_connector/hid_device.py).
    "hidapi==0.15.0; sys_platform == 'darwin'",
    "pyserial==3.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.14.11"]

[project.scripts]
moza2keelson = "moza_connector.app:main"
moza-rudder-sim = "moza_connector.rudder_sim_app:main"

[tool.setuptools]
packages = ["moza_connector"]

[tool.setuptools.package-data]
moza_connector = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end test that runs the CLI against an isolated in-process Zenoh peer"]

[tool.ruff]
line-length = 120
